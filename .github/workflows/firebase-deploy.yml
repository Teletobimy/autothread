name: Deploy to Firebase & Cloud Run

on:
  push:
    branches:
      - master  # master 브랜치에 푸시할 때마다 자동 배포

env:
  PROJECT_ID: project-4d38b
  REGION: asia-northeast3
  SERVICE_NAME: thread-poster-backend

jobs:
  # Deploy Backend to Cloud Run
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source backend \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
            --set-env-vars "LONG_LIVED_ACCESS_TOKEN=${{ secrets.LONG_LIVED_ACCESS_TOKEN }}" \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GCP_PRIVATE_KEY=${{ secrets.GCP_PRIVATE_KEY }}" \
            --set-env-vars "GCP_CLIENT_EMAIL=${{ secrets.GCP_CLIENT_EMAIL }}"

  # Deploy Frontend to Firebase Hosting
  deploy-frontend:
    name: Deploy Frontend to Firebase
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: project-4d38b.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: project-4d38b
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: project-4d38b.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 229679006764
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_BACKEND_URL: https://thread-poster-backend-229679006764.asia-northeast3.run.app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: project-4d38b

  # Deploy Firestore Rules & Indexes
  deploy-firestore:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    needs: deploy-frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # Deploy Storage Rules
  deploy-storage:
    name: Deploy Storage Rules
    runs-on: ubuntu-latest
    needs: deploy-frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Storage Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
